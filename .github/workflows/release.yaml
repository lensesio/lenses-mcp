# Release — triggered on semantic version tags.
# Runs CI checks, builds multi-arch Docker images, and creates a GitHub Release
# with checksums and auto-generated release notes from the commit log.
#
# On the internal org, images are pushed to Docker Hub, GCR, and AWS ECR.
# On forks, only Docker Hub is used (GCR/ECR steps are skipped).
#
# Supported tag patterns:
#   v1.0.0, v1.0.0-alpha.1, v1.0.0-beta.1, v1.0.0-rc.1
#
# Required secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Required secrets (internal org only):
#   ECR_AWS_ACCESS_KEY_ID, ECR_AWS_SECRET_ACCESS_KEY
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
# Required vars:
#   INTERNAL_ORG — GitHub org name that owns the internal registries
# Required vars (internal org only):
#   GCR_REGISTRY (e.g. ${GCR_REGISTRY})
#   ECR_REGISTRY (e.g. 123456789.dkr.ecr.${AWS_REGION}.amazonaws.com)

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  # Run full CI first
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      INTERNAL_ORG: ${{ vars.INTERNAL_ORG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MINOR_VERSION=$(echo "${VERSION}" | sed -re 's/([0-9]+\.[0-9]+)\..*/\1/')

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "minor_version=${MINOR_VERSION}" >> "${GITHUB_OUTPUT}"

          # Determine pre-release status
          if echo "${TAG}" | grep -qE '-(alpha|beta|rc)\.[0-9]+$'; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo 'body<<EOF'
            echo "## Docker"
            echo ""
            echo '```bash'
            echo "docker pull lensesio/mcp:${{ steps.meta.outputs.version }}"
            echo '```'
            echo ""
            echo "## What's Changed"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
                | grep -v -E '^\- (chore|ci)(\(|:)' || true
            else
              git log --pretty=format:"- %s" -20 \
                | grep -v -E '^\- (chore|ci)(\(|:)' || true
            fi
            echo ""
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.meta.outputs.tag }}"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build internal registry tags
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        id: internal
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          MINOR="${{ steps.meta.outputs.minor_version }}"
          GCR="${{ vars.GCR_REGISTRY }}"
          ECR="${{ vars.ECR_REGISTRY }}"

          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            TAGS="${GCR}/lenses-mcp:${VERSION}"
            TAGS="${TAGS},${ECR}/lenses-mcp:${VERSION}"
          else
            TAGS="${GCR}/lenses-mcp:${VERSION}"
            TAGS="${TAGS},${GCR}/lenses-mcp:${MINOR}"
            TAGS="${TAGS},${GCR}/lenses-mcp:latest"
            TAGS="${TAGS},${ECR}/lenses-mcp:${VERSION}"
            TAGS="${TAGS},${ECR}/lenses-mcp:${MINOR}"
            TAGS="${TAGS},${ECR}/lenses-mcp:latest"
          fi

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${AWS_REGION}

      - name: Login to Amazon ECR
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          mask-password: "true"

      - name: Authenticate to Google Cloud
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        id: gcp-auth
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: access_token
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Google Cloud Registry
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
          registry: ${{ vars.GCR_REGISTRY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release images (stable)
        if: steps.meta.outputs.prerelease == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            lensesio/mcp:${{ steps.meta.outputs.version }}
            lensesio/mcp:${{ steps.meta.outputs.minor_version }}
            lensesio/mcp:latest${{ steps.internal.outputs.tags && format(',{0}', steps.internal.outputs.tags) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push release images (pre-release)
        if: steps.meta.outputs.prerelease == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            lensesio/mcp:${{ steps.meta.outputs.version }}${{ steps.internal.outputs.tags && format(',{0}', steps.internal.outputs.tags) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed internal registry tags
        if: env.INTERNAL_ORG != '' && github.repository_owner == env.INTERNAL_ORG
        run: |
          echo "=== Google Container Registry ==="
          echo "  ${{ vars.GCR_REGISTRY }}/lenses-mcp:${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.prerelease }}" = "false" ]; then
            echo "  ${{ vars.GCR_REGISTRY }}/lenses-mcp:${{ steps.meta.outputs.minor_version }}"
            echo "  ${{ vars.GCR_REGISTRY }}/lenses-mcp:latest"
          fi
          echo ""
          echo "=== AWS ECR ==="
          echo "  ${{ vars.ECR_REGISTRY }}/lenses-mcp:${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.prerelease }}" = "false" ]; then
            echo "  ${{ vars.ECR_REGISTRY }}/lenses-mcp:${{ steps.meta.outputs.minor_version }}"
            echo "  ${{ vars.ECR_REGISTRY }}/lenses-mcp:latest"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: false
